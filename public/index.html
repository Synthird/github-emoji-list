<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="application-name" content="GitHub emoji list">
	<meta name="author" content="Synthird">
	<meta name="description" content="A list of emojis taken from the GitHub API.">
	<meta name="keywords" content="GitHub, emoji, README, cheatsheet">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles/main.css">
	<title>GitHub emoji list</title>
</head>

<body>
	<header>
		<h1>GitHub emoji list</h1>
		<p><a href="https://github.com/synthird/github-emoji-list" target="_blank">Source code</a></p>
		<p>A list of GitHub emojis taken from the <a href="https://docs.github.com/rest/emojis/emojis" target="_blank">GitHub API</a>.</p>
		<noscript>
			<p>JavaScript must be enabled to see the emojis.</p>
		</noscript>
	</header>

	<main>
		<div id="loading-text">
			<p>Loading...</p>
		</div>

		<div class="search-div">
			<div>
				<label for="search-bar">Search emojis (Seperate multiple words with underscores)</label>
			</div>
			
			<div>
				<input type="search" id="search-bar" placeholder="E.g: smile, smile_cat, etc.">
			</div>
		</div>

		<div class="emoji-list"></div>
	</main>

	<script src="scripts/index.js"></script>
</body>

</html>
